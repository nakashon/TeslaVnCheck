<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestMaTesla brand assets</title>
  <link rel="icon" href="/brand-mark.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; font-family: Arial, sans-serif; }
    #social-preview { width: 1200px; height: 630px; padding: 58px 68px 46px; background: #222833; color: #fff; position: relative; overflow: hidden; }
    .glow { position: absolute; width: 570px; height: 570px; border-radius: 50%; left: -200px; top: -270px; border: 95px solid #ffffff03; }
    header { display: flex; align-items: center; justify-content: space-between; position: relative; }
    .brand { display: flex; align-items: center; gap: 17px; direction: ltr; font-size: 39px; font-weight: 750; letter-spacing: -1.5px; }
    .brand img { width: 72px; height: 72px; }
    .brand em { font-style: normal; color: #ef8293; }
    .eyebrow { font-size: 19px; color: #c4cad5; }
    main { margin-top: 49px; display: flex; align-items: center; justify-content: space-between; gap: 36px; }
    h1 { margin: 0; font-size: 66px; line-height: 1.2; letter-spacing: -1.5px; font-weight: 750; }
    h1 span { color: #f6d36b; }
    .features { margin: 24px 0 0; font-size: 25px; color: #d1d6df; word-spacing: 5px; }
    .plate-card { width: 310px; flex-shrink: 0; padding: 25px 20px; border: 1px solid #526074; border-radius: 20px; background: #2b3443; transform: rotate(-5deg); text-align: center; }
    .plate { direction: ltr; display: flex; height: 77px; border-radius: 10px; overflow: hidden; background: #f6d36b; box-shadow: 0 6px 20px #0002; }
    .country { display: grid; align-items: end; padding-bottom: 14px; width: 37px; background: #4775b5; color: #fff; font-size: 15px; }
    .digits { color: #252b35; font-size: 30px; letter-spacing: 3px; flex: 1; display: grid; place-items: center; font-weight: 700; }
    .plate-card p { margin: 20px 0 0; color: #e0e5ed; font-size: 20px; }
    .plate-card small { display: block; margin-top: 10px; color: #a7b3c5; font-size: 14px; }
    footer { position: absolute; bottom: 46px; right: 68px; left: 68px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #4a5361; padding-top: 27px; }
    .url { font-size: 25px; color: #fff; direction: ltr; letter-spacing: .5px; }
    .trust { color: #bac4d2; font-size: 19px; }
    #touch-icon { display: block; width: 180px; height: 180px; background: #222833; }
    #favicon { display: block; width: 32px; height: 32px; background: #222833; }
  </style>
</head>
<body>
  <article id="social-preview">
    <div class="glow"></div>
    <header>
      <div class="brand"><img src="/brand-mark.svg" alt="" /><div>Test<em>Ma</em>Tesla</div></div>
      <span class="eyebrow">לפני הקנייה. לאורך הדרך.</span>
    </header>
    <main>
      <div>
        <h1>כל המידע על הטסלה<br /><span>לפי מספר רישוי</span></h1>
        <p class="features">סוללה · ריקולים · היסטוריית רכב</p>
      </div>
      <div class="plate-card">
        <div class="plate"><span class="country">IL</span><span class="digits">•••-••-•••</span></div>
        <p>מספר אחד. תמונה ברורה.</p>
        <small>בלי לנחש לפי שנת הדגם.</small>
      </div>
    </main>
    <footer><span class="trust">חינם · בעברית · ללא הרשמה</span><span class="url">testmatesla.com</span></footer>
  </article>
  <img id="touch-icon" src="/brand-mark.svg" alt="TestMaTesla icon" />
  <img id="favicon" src="/brand-mark.svg" alt="TestMaTesla favicon" />
</body>
</html>
